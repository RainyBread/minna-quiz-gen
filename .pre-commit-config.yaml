repos:
  - repo: local
    hooks:
      - id: repo-hygiene
        name: repo hygiene
        entry: python tools/check_repo_hygiene.py
        language: system
        pass_filenames: false
      - id: repo-hygiene-history
        name: repo hygiene (git history)
        entry: python tools/check_repo_hygiene.py --history
        language: system
        pass_filenames: false
        stages: [pre-push]
